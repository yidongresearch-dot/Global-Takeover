<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Global Takeover</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
    }
    #app-container {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      background: linear-gradient(180deg, #dcfce7 0%, #bae6fd 100%);
    }
    .page {
      display: none; width: 100%; height: 100%; flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 18px env(safe-area-inset-bottom, 16px) 18px;
    }
    .page.active { display: flex; }
    .header-title {
      text-align: center; font-size: 26px; font-weight: 900; color: #0f172a;
      margin: 12px 0 4px 0; letter-spacing: -0.5px;
    }
    .sub-title {
      text-align: center; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 12px;
    }
    .stats-bar {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 8px;
    }
    .pill {
      background: #ffffff; padding: 6px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 800; color: #0f172a;
      box-shadow: 0 2px 6px rgba(15,23,42,0.08);
    }
    .section-label {
      text-align: center; font-size: 11px; font-weight: 800; color: #475569;
      letter-spacing: 1px; margin: 14px 0 10px 0; text-transform: uppercase;
    }
    .upg-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .upg-btn {
      background: #ffffff; border: 2px solid #e2e8f0; border-radius: 16px;
      padding: 14px 10px; text-align: center; cursor: pointer;
      box-shadow: 0 3px 8px rgba(15,23,42,0.06);
    }
    .upg-btn:active { transform: scale(0.97); }
    .upg-name { font-size: 13px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .upg-cost { font-size: 12px; font-weight: 700; color: #d97706; }
    .go-btn {
      width: 100%; background: #16a34a; color: #ffffff; font-size: 18px; font-weight: 900;
      padding: 16px; border: none; border-radius: 18px; cursor: pointer;
      box-shadow: 0 6px 14px rgba(22,163,74,0.3);
    }
    .go-btn:active { transform: scale(0.98); }
    #state-page { padding: 0; position: relative; }
    #top-hud {
      position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center; z-index: 10;
      pointer-events: none;
    }
    .hud-btn {
      pointer-events: auto; background: rgba(15,23,42,0.8); color: #fff;
      border: none; border-radius: 12px; padding: 8px 14px; font-size: 13px; font-weight: 800;
    }
    #game-status {
      background: rgba(255,255,255,0.9); color: #0f172a; padding: 8px 14px;
      border-radius: 12px; font-size: 13px; font-weight: 800;
    }
    #next-btn {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: #eab308; color: #0f172a; font-size: 18px; font-weight: 900;
      padding: 16px 32px; border: none; border-radius: 18px; z-index: 20;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25); display: none;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- LOBBY PAGE -->
    <div id="lobby-page" class="page active">
      <div class="header-title">Global Takeover 🌍</div>
      <div id="region-preview" class="sub-title">Next Theatre: Heartland Basin</div>

      <div class="stats-bar">
        <div class="pill">⭐️ <span id="menu-stars">0</span></div>
        <div class="pill">⚡ <span id="menu-energy">30</span>/30 <span id="energy-timer" style="font-size:11px; color:#64748b;">(Full)</span></div>
      </div>
      <div style="text-align:center; font-size:12px; font-weight:700; color:#475569;">
        Levels Cleared: <span id="highest-lvl">0</span>
      </div>

      <div class="section-label">Upgrade Skills</div>
      <div class="upg-grid">
        <button class="upg-btn" onclick="buyUpgrade('speed')">
          <div class="upg-name">👟 Speed: Lvl <span id="lvl-speed">1</span></div>
          <div class="upg-cost">Need <span id="cost-speed">1</span> ⭐️</div>
        </button>
        <button class="upg-btn" onclick="buyUpgrade('repro')">
          <div class="upg-name">🌱 Growth: Lvl <span id="lvl-repro">1</span></div>
          <div class="upg-cost">Need <span id="cost-repro">1</span> ⭐️</div>
        </button>
        <button class="upg-btn" onclick="buyUpgrade('cap')">
          <div class="upg-name">🏰 Max Cap: Lvl <span id="lvl-cap">1</span></div>
          <div class="upg-cost">Need <span id="cost-cap">1</span> ⭐️</div>
        </button>
        <button class="upg-btn" onclick="buyUpgrade('start')">
          <div class="upg-name">⚔️ Start Army: Lvl <span id="lvl-start">1</span></div>
          <div class="upg-cost">Need <span id="cost-start">1</span> ⭐️</div>
        </button>
      </div>

      <div style="margin-top:auto; margin-bottom:14px; text-align:center;">
        <button id="invade-btn" class="go-btn" onclick="startBattle()">INVADE LVL <span id="next-lvl-btn">1</span> (-3 ⚡)</button>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="watchRewardAd('energy')" style="flex:1; background:#0284c7; color:#fff; font-size:13px; font-weight:800; padding:14px 6px; border:none; border-radius:14px;">
            🎬 +15 Energy ⚡
          </button>
          <button onclick="watchRewardAd('stars')" style="flex:1; background:#d97706; color:#fff; font-size:13px; font-weight:800; padding:14px 6px; border:none; border-radius:14px;">
            🎬 +3 Stars ⭐️
          </button>
        </div>
        <p id="energy-msg" style="font-size:12px; color:#dc2626; font-weight:700; margin:8px 0 0 0; min-height:16px;"></p>
        <button onclick="resetSave()" style="font-size:11px; color:#ef4444; font-weight:700; background:none; border:none; text-decoration:underline; margin-top:4px;">Reset Saved Data</button>
      </div>
    </div>

    <!-- BATTLE PAGE -->
    <div id="state-page" class="page">
      <div id="top-hud">
        <button class="hud-btn" onclick="openGame('lobby-page')">← Lobby</button>
        <div id="game-status">Lvl 1</div>
      </div>
      <canvas id="stateCanvas"></canvas>
      <button id="next-btn" onclick="nextLevel()">NEXT THEATRE →</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
