<script src="https://tailwindcss.com"></script>
<style>
  body { margin:0; padding:0; font-family:sans-serif; background:#f0f2f5; height:100vh; display:flex; justify-content:center; touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none; overflow:hidden; }
  .wrap { width:100%; max-width:420px; height:100vh; position:relative; background:linear-gradient(135deg,#a7f3d0,#e0f2fe); }
  .page { position:absolute; inset:0; display:none; flex-direction:column; padding:18px; box-sizing:border-box; }
  .page.active { display:flex; }
  .up-btn { background:#fff; border:1px solid #cbd5e1; border-radius:14px; padding:10px 6px; text-align:center; color:#1e293b; font-weight:700; box-shadow:0 2px 5px rgba(0,0,0,0.04); }
  .up-btn:active { transform:scale(0.96); background:#f8fafc; }
  .go-btn { width:100%; background:linear-gradient(135deg,#059669,#047857); color:#fff; font-size:18px; font-weight:800; padding:18px; border:none; border-radius:22px; box-shadow:0 10px 20px rgba(4,120,87,0.35); }
  .go-btn:active { transform:scale(0.96); }
  .stage { width:100%; aspect-ratio:1/1; background:#38bdf8; border-radius:26px; overflow:hidden; margin:auto 0; border:4px solid #0284c7; box-shadow:inset 0 4px 12px rgba(0,0,0,0.15); }
</style>

<div class="wrap">
  <!-- LOBBY -->
  <div id="menu-page" class="page active" style="text-align:center;">
    <div style="margin-top:16px; margin-bottom:14px;">
      <h1 style="font-size:25px; color:#1e3a8a; margin:0; font-weight:800;">Global Takeover 🌍</h1>
      <p id="region-preview" style="font-size:12px; color:#475569; margin:4px 0 0 0; font-weight:600;">Next Theatre: Heartland Basin</p>
      
      <!-- STARS & ENERGY BAR -->
      <div style="display:flex; justify-content:center; gap:8px; margin-top:10px; flex-wrap:wrap;">
        <div style="font-size:14px; font-weight:800; color:#b45309; background:#fef3c7; padding:5px 14px; border-radius:999px; border:1px solid #fde68a;">
          ⭐️ <span id="menu-stars">0</span>
        </div>
        <div style="font-size:14px; font-weight:800; color:#0369a1; background:#e0f2fe; padding:5px 14px; border-radius:999px; border:1px solid #7dd3fc;">
          ⚡ <span id="menu-energy">30</span>/30 <span id="energy-timer" style="font-size:11px; font-weight:600; color:#0284c7;">(Full)</span>
        </div>
      </div>

      <div style="font-size:12px; color:#1e3a8a; font-weight:700; margin-top:6px;">Levels Cleared: <span id="highest-lvl">0</span></div>
    </div>

    <div class="bg-white/75 backdrop-blur-md rounded-2xl p-3 mb-4 shadow-sm w-full">
      <div style="font-size:12px; font-weight:800; color:#334155; margin-bottom:8px; text-transform:uppercase;">Upgrade Skills</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px;">
        <button onclick="buyUpgrade('speed')" class="up-btn">🚀 Speed: Lvl <span id="lvl-speed">1</span><br><span style="font-size:10px; color:#d97706;">Need <span id="cost-speed">1</span> ⭐️</span></button>
        <button onclick="buyUpgrade('repro')" class="up-btn">🌱 Growth: Lvl <span id="lvl-repro">1</span><br><span style="font-size:10px; color:#d97706;">Need <span id="cost-repro">1</span> ⭐️</span></button>
        <button onclick="buyUpgrade('cap')" class="up-btn">🛡️ Max Cap: Lvl <span id="lvl-cap">1</span><br><span style="font-size:10px; color:#d97706;">Need <span id="cost-cap">1</span> ⭐️</span></button>
        <button onclick="buyUpgrade('start')" class="up-btn">🐴 Start Army: Lvl <span id="lvl-start">1</span><br><span style="font-size:10px; color:#d97706;">Need <span id="cost-start">1</span> ⭐️</span></button>
      </div>
    </div>

    <div style="margin-top:auto; margin-bottom:14px;">
      <button id="invade-btn" class="go-btn" onclick="startBattle()">INVADE LVL <span id="next-lvl-btn">1</span> (-3 ⚡)</button>
<div style="display:flex; gap:8px; margin-top:10px;">
  <button onclick="watchRewardAd('energy')" style="flex:1; background:#0284c7; color:#fff; font-size:12px; font-weight:800; padding:12px 6px; border:none; border-radius:14px;">
    🎬 +15 Energy ⚡
  </button>
  <button onclick="watchRewardAd('stars')" style="flex:1; background:#d97706; color:#fff; font-size:12px; font-weight:800; padding:12px 6px; border:none; border-radius:14px;">
    🎬 +3 Stars ⭐️
  </button>
</div>

      <p id="energy-msg" style="font-size:11px; color:#dc2626; font-weight:700; margin:6px 0 0 0; min-height:15px;"></p>
      <button onclick="resetSave()" style="font-size:11px; color:#ef4444; font-weight:700; background:none; border:none; text-decoration:underline; margin-top:4px;">Reset Saved 
Data</button>
    </div>
  </div>

  <!-- BATTLEFIELD -->
  <div id="state-page" class="page">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
      <button onclick="openGame('menu-page')" style="background:rgba(255,255,255,0.85); border:none; padding:8px 14px; border-radius:999px; font-weight:700; color:#1e3a8a;">⬅ Lobby</button>
      <div id="game-status" style="background:#0284c7; color:#fff; padding:6px 14px; border-radius:999px; font-weight:700; font-size:12px;">Drag to Attack!</div>
    </div>
    <div class="stage"><canvas id="stateCanvas"></canvas></div>
    <button id="next-btn" onclick="openGame('menu-page')" style="width:100%; background:#4f46e5; color:#fff; font-size:17px; font-weight:800; padding:15px; border:none; border-radius:20px; margin-bottom:10px; display:none;">Collect Stars & Continue ➡️</button>
  </div>
</div>
