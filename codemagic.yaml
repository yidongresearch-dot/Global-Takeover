workflows:
  android-build:
    name: Build Signed Android App Bundle
    max_build_duration: 30
    environment:
      android_signing:
        - release
      node: 20
      java: 17
    scripts:
      - name: Install Capacitor and AdMob
        script: npm install
      - name: Generate Android Native Project
        script: npx cap add android
      - name: Sync Web Files to Android
        script: npx cap sync android
      - name: Build Signed Release App Bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  ios-build:
    name: Build iOS App for TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.globaltakeover.game
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize keychain to be used for codesigning
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.globaltakeover.game" \
            --type IOS_APP_STORE \
            --create
      - name: Use system default keychain
        script: keychain add-certificates
      - name: Install Capacitor and AdMob
        script: npm install
      - name: Generate iOS Native Project
        script: npx cap add ios
      - name: Sync Web Files to iOS
        script: npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
