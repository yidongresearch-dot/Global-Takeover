workflows:
  android-build:
    name: Build Signed Android App Bundle
    max_build_duration: 30
    environment:
      android_signing:
        - release
      node: 20
      java: 17
    scripts:
      - name: Install Capacitor and AdMob
        script: npm install
      - name: Generate Android Native Project
        script: npx cap add android
      - name: Sync Web Files to Android
        script: npx cap sync android
      - name: Build Signed Release App Bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
  ios-build:
    name: Build iOS App for TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: Global takeovers
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize keychain to be used for codesigning
        script: keychain initialize
      - name: Generate RSA private key and fetch signing files
        script: |
          openssl genrsa -out cert_key.pem 2048
          app-store-connect fetch-signing-files "com.globaltakeover.game" \
            --type IOS_APP_STORE \
            --certificate-key=@file:cert_key.pem \
            --create
      - name: Use system default keychain
        script: keychain add-certificates
      - name: Install Capacitor and AdMob
        script: npm install
      - name: Generate iOS Native Project
        script: npx cap add ios
      - name: Add AdMob App ID to iOS Info.plist
        script: |
          plutil -replace GADApplicationIdentifier -string "ca-app-pub-4880916608905697~2212610572" ios/App/App/Info.plist
          plutil -replace NSUserTrackingUsageDescription -string "This identifier will be used to deliver personalized ads to you." ios/App/App/Info.plist
      - name: Sync Web Files to iOS
        script: npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
